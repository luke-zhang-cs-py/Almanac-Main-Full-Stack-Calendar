<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee chat — Almanac</title>
<meta name="theme-color" content="#12161d">
<!-- class="theme-dark" themes the page with no JavaScript; this only restores a theme
     picked earlier, before first paint, from the key the whole site shares. -->
<script>try { var t = localStorage.getItem('theme'); if (/^[a-z]+$/.test(t)) document.documentElement.classList.replace('theme-dark', 'theme-' + t); } catch (e) {}</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  /* Built from the same tokens as the app (static/css/style.css) so this page
     belongs to it, but laid out as a single-purpose page rather than a
     dashboard. The guest has one decision to make; everything here serves
     that decision. Colours are semantic tokens only, so every theme works. */
  .cc-wrap { max-width: 720px; margin: 0 auto; padding: var(--space-12) var(--space-6) var(--space-18); }
  .cc-top { display: flex; justify-content: flex-end; margin-bottom: var(--space-4); }
  .cc-head { margin-bottom: var(--space-7); }
  .cc-head h1 { font-family: var(--font-display); font-size: var(--text-4xl);
    margin: 0 0 var(--space-3); color: var(--color-text-primary); letter-spacing: var(--tracking-snug); }
  .cc-head p { color: var(--color-text-muted); font-size: var(--text-lg); line-height: 1.6;
    margin: 0 0 var(--space-2); }
  .cc-quote { border-left: 2px solid var(--color-accent); padding-left: var(--space-4);
    color: var(--color-text-muted); font-style: italic; margin: var(--space-4) 0 0; }

  /* The priced session behind the invite. Shown before the times, because
     somebody deciding whether to book needs the price first -- burying it
     under a slot picker is the pattern that makes people distrust a page. */
  .cc-offer { background: var(--color-surface-subtle); border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-accent); border-radius: var(--radius-m);
    padding: var(--space-4) var(--space-5); margin-top: var(--space-5); }
  .cc-offer .top { display: flex; justify-content: space-between;
    align-items: baseline; gap: var(--space-4); flex-wrap: wrap; }
  .cc-offer h3 { margin: 0; font-size: var(--text-xl); color: var(--color-text-primary);
    font-family: var(--font-display); font-weight: var(--weight-semibold); }
  .cc-price { font-family: var(--font-mono); font-size: var(--text-xl); font-weight: var(--weight-semibold);
    color: var(--color-accent-strong); white-space: nowrap; }
  .cc-price.free { color: var(--color-secondary); }
  .cc-offer .tags { display: flex; gap: var(--space-2); margin-top: var(--space-2); flex-wrap: wrap; }
  .cc-tag { font-size: var(--text-2xs); letter-spacing: 0.05em; text-transform: uppercase;
    background: var(--color-surface-raised); color: var(--color-text-muted);
    border-radius: var(--radius-pill); padding: 3px var(--space-3); font-weight: var(--weight-semibold); }
  .cc-offer p { color: var(--color-text-muted); font-size: var(--text-md); line-height: var(--leading-relaxed);
    margin: var(--space-3) 0 0; }

  .cc-meta { display: flex; flex-wrap: wrap; gap: var(--space-5); margin-top: var(--space-5);
    padding-top: var(--space-5); border-top: 1px solid var(--color-border); }
  .cc-meta div { font-size: var(--text-sm); }
  .cc-meta span { display: block; color: var(--color-text-subtle); font-size: var(--text-2xs);
    letter-spacing: var(--tracking-label); text-transform: uppercase; margin-bottom: 3px; }
  .cc-meta b { color: var(--color-text-primary); font-weight: var(--weight-semibold);
    font-family: var(--font-mono); font-size: var(--text-sm); }

  .cc-card { background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-l); padding: var(--space-6); margin-top: var(--space-6);
    box-shadow: var(--shadow-card); }
  .cc-card h2 { font-size: var(--text-xs); letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--color-text-subtle); margin: 0 0 var(--space-4); font-weight: var(--weight-semibold); }

  .cc-day { margin-bottom: var(--space-5); }
  .cc-day > h3 { font-size: var(--text-sm); color: var(--color-text-primary); margin: 0 0 var(--space-2);
    font-weight: var(--weight-semibold); }
  .cc-slots { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .cc-slot { background: var(--color-surface-subtle); border: 1px solid var(--color-border);
    color: var(--color-text-primary); border-radius: var(--radius-s); padding: var(--space-2) var(--space-3);
    font-family: var(--font-mono); font-size: var(--text-sm); cursor: pointer;
    transition: border-color var(--duration) var(--ease), background var(--duration) var(--ease); }
  .cc-slot:hover { border-color: var(--color-accent); background: var(--color-surface-raised); }
  .cc-slot.sel { background: var(--color-accent); border-color: var(--color-accent);
    color: var(--color-text-on-accent); font-weight: var(--weight-semibold); }

  .cc-field { margin-top: var(--space-4); }
  .cc-field label { display: block; font-size: var(--text-xs); color: var(--color-text-subtle);
    margin-bottom: var(--space-2); }
  .cc-field input, .cc-field textarea { width: 100%; background: var(--color-bg);
    border: 1px solid var(--color-border-strong); color: var(--color-text-primary);
    border-radius: var(--radius-s); padding: var(--space-3); font-size: var(--text-base);
    font-family: var(--font-sans); }
  .cc-field input:focus, .cc-field textarea:focus { outline: none;
    border-color: var(--color-accent); }

  .cc-actions { display: flex; gap: var(--space-3); margin-top: var(--space-5); flex-wrap: wrap; }
  .cc-btn { background: var(--color-accent); color: var(--color-text-on-accent); border: none;
    border-radius: var(--radius-s); padding: var(--space-3) var(--space-5); font-weight: var(--weight-bold);
    font-size: var(--text-base); cursor: pointer; font-family: var(--font-sans); }
  .cc-btn:hover:not(:disabled) { background: var(--color-accent-hover); }
  .cc-btn:disabled { opacity: .45; cursor: not-allowed; }
  .cc-btn.ghost { background: transparent; border: 1px solid var(--color-border-strong);
    color: var(--color-text-muted); font-weight: var(--weight-semibold); }
  .cc-btn.ghost:hover { border-color: var(--color-accent); }

  .cc-note { font-size: var(--text-sm); color: var(--color-text-subtle); line-height: 1.6;
    margin-top: var(--space-4); }
  .cc-msg { border-radius: var(--radius-s); padding: var(--space-3) var(--space-4); font-size: var(--text-md);
    line-height: var(--leading-body); margin-top: var(--space-4); }
  .cc-msg.err { background: var(--color-danger-subtle); border: 1px solid var(--color-danger);
    color: var(--color-danger); }
  .cc-msg.ok { background: var(--color-secondary-subtle); border: 1px solid var(--color-secondary-fill);
    color: var(--color-secondary); }
  .cc-done { text-align: center; padding: var(--space-8) var(--space-3); }
  .cc-done h2 { font-family: var(--font-display); font-size: var(--text-3xl);
    color: var(--color-text-primary); margin: 0 0 var(--space-3); text-transform: none;
    letter-spacing: 0; }
</style>
</head>
<body>
<div class="cc-wrap">
<div class="cc-top">
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>
<div id="root">
  <div class="cc-card"><div class="cc-note">Loading your invite…</div></div>
</div>
</div>

<script>
const TOKEN = {{ token | tojson }};
const root = document.getElementById('root');
let state = { data: null, date: null, time: null };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

async function load() {
  try {
    const res = await fetch(`/api/coffee/public/${encodeURIComponent(TOKEN)}`);
    const data = await res.json();
    if (!res.ok) return fail(data.error || 'This invite link is not valid.');
    state.data = data;
    render();
  } catch (e) {
    fail('Could not reach the server. Please try again.');
  }
}

function fail(message) {
  root.innerHTML = `<div class="cc-card"><div class="cc-msg err">${esc(message)}</div></div>`;
}

/* An invite may be for a specific priced session or just a general chat.
 * When it is priced, the price and the full description come before the
 * slot picker -- deciding whether to book is a different question from
 * deciding when, and the money answers the first one. */
function offerHtml(o) {
  if (!o) return '';
  return `
    <div class="cc-offer">
      <div class="top">
        <h3>${esc(o.title)}</h3>
        <span class="cc-price${o.isFree ? ' free' : ''}">${esc(o.price)}</span>
      </div>
      <div class="tags">
        <span class="cc-tag">${o.durationMin} min</span>
        ${o.category ? `<span class="cc-tag">${esc(o.category)}</span>` : ''}
        ${o.level ? `<span class="cc-tag">${esc(o.level)}</span>` : ''}
      </div>
      ${o.description ? `<p>${esc(o.description)}</p>` : ''}
    </div>`;
}

function render() {
  const d = state.data;

  if (!d.open) {
    const why = d.status === 'booked'
      ? 'This invite has already been used to book a time.'
      : d.status === 'declined'
      ? 'This invite was declined.'
      : 'This invite is no longer open.';
    root.innerHTML = `
      <div class="cc-head"><h1>Coffee chat with ${esc(d.hostName)}</h1></div>
      <div class="cc-card"><div class="cc-msg err">${esc(why)}</div>
        <div class="cc-note">If you still want to meet, ask
          ${esc(d.hostName)} to send a fresh link.</div></div>`;
    return;
  }

  const days = d.days || [];
  const slotsHtml = days.length ? days.map((day) => `
    <div class="cc-day">
      <h3>${esc(day.label || day.date)}</h3>
      <div class="cc-slots">
        ${day.slots.map((s) => {
          const t = s.start_time || s.start || s;
          const on = state.date === day.date && state.time === t;
          return `<button class="cc-slot${on ? ' sel' : ''}"
                    data-date="${esc(day.date)}" data-time="${esc(t)}">${esc(t)}</button>`;
        }).join('')}
      </div>
    </div>`).join('')
    : `<div class="cc-note">No open times in the next couple of weeks.
       Reply to the email and ${esc(d.hostName)} can open more.</div>`;

  root.innerHTML = `
    <div class="cc-head">
      <h1>${esc(d.hostName)} would like a coffee chat</h1>
      <p>${d.offering ? 'Pick whatever time suits you.'
           : esc(d.topic) + ' — ' + d.durationMin + ' minutes. Pick whatever time suits you.'}</p>
      ${d.message ? `<p class="cc-quote">${esc(d.message)}</p>` : ''}
      ${offerHtml(d.offering)}
      <div class="cc-meta">
        <div><span>With</span><b>${esc(d.hostName)}</b></div>
        <div><span>Length</span><b>${d.durationMin} min</b></div>
        <div><span>You</span><b>${esc(d.guestEmail)}</b></div>
      </div>
    </div>

    <div class="cc-card">
      <h2>Choose a time</h2>
      ${slotsHtml}
    </div>

    <div class="cc-card">
      <h2>Your details</h2>
      <div class="cc-field">
        <label for="nm">Name</label>
        <input id="nm" type="text" value="${esc(d.guestName || '')}"
               placeholder="How should they greet you?">
      </div>
      <div class="cc-field">
        <label for="nt">Anything to add? (optional)</label>
        <textarea id="nt" rows="3" placeholder="A line about what you'd like to talk about."></textarea>
      </div>
      <div class="cc-actions">
        <button class="cc-btn" id="go" disabled>Confirm</button>
        <button class="cc-btn ghost" id="no">Can't make it</button>
      </div>
      <div class="cc-note">No account needed. You'll get a confirmation by email,
        and a reminder the day before.</div>
      <div id="msg"></div>
    </div>`;

  root.querySelectorAll('.cc-slot').forEach((b) => {
    b.onclick = () => {
      state.date = b.dataset.date;
      state.time = b.dataset.time;
      render();
    };
  });
  const go = document.getElementById('go');
  if (go) {
    go.disabled = !(state.date && state.time);
    if (state.date && state.time) {
      go.textContent = `Confirm ${state.time}`;
    }
    go.onclick = confirmBooking;
  }
  document.getElementById('no').onclick = declineInvite;
}

function say(kind, text) {
  document.getElementById('msg').innerHTML =
    `<div class="cc-msg ${kind}">${esc(text)}</div>`;
}

async function confirmBooking() {
  const go = document.getElementById('go');
  go.disabled = true;
  go.textContent = 'Booking…';
  try {
    const res = await fetch(`/api/coffee/public/${encodeURIComponent(TOKEN)}/book`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: state.date,
        time: state.time,
        name: document.getElementById('nm').value,
        note: document.getElementById('nt').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      say('err', data.error || 'Could not book that time.');
      go.disabled = false;
      go.textContent = 'Confirm';
      /* A 409 means the slot went while this page was open, so the times on
       * screen are already stale -- reload rather than let them try again
       * against a list that is wrong. */
      if (res.status === 409) setTimeout(load, 1200);
      return;
    }
    root.innerHTML = `
      <div class="cc-card cc-done">
        <h2>You're booked in</h2>
        <p class="cc-note">${esc(data.date)} at ${esc(data.startTime)}–${esc(data.endTime)}
          with ${esc(state.data.hostName)}.</p>
        <p class="cc-note">A confirmation is on its way to
          ${esc(state.data.guestEmail)}.</p>
      </div>`;
  } catch (e) {
    say('err', 'Could not reach the server. Please try again.');
    go.disabled = false;
    go.textContent = 'Confirm';
  }
}

async function declineInvite() {
  const reason = prompt('Anything you want to pass on? (optional)') ?? '';
  try {
    const res = await fetch(`/api/coffee/public/${encodeURIComponent(TOKEN)}/decline`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason }),
    });
    const data = await res.json();
    if (!res.ok) return say('err', data.error || 'Could not do that.');
    root.innerHTML = `
      <div class="cc-card cc-done">
        <h2>Thanks for letting them know</h2>
        <p class="cc-note">${esc(state.data.hostName)} has been told. Nothing
          was held on either calendar.</p>
      </div>`;
  } catch (e) {
    say('err', 'Could not reach the server. Please try again.');
  }
}

/* Theme. Each name needs a .theme-<name> block in static/css/style.css;
 * adding a theme is that block plus one entry here. Saved under 'theme',
 * the key the rest of the site uses. */
const THEMES = ['dark', 'light'];
(function () {
  const html = document.documentElement;
  let theme = THEMES.find((t) => html.classList.contains('theme-' + t)) || THEMES[0];
  const next = () => THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  const apply = (name) => {
    html.className = (html.className.replace(/(^|\s)theme-\S+/g, '').trim() + ' theme-' + name).trim();
    theme = name;
    document.querySelectorAll('[data-theme-toggle]').forEach((b) =>
      b.setAttribute('aria-label', `Switch to ${next()} theme`));
    const bg = getComputedStyle(html).getPropertyValue('--color-bg').trim();
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => { m.content = bg; });
  };
  apply(theme);   // also drops a saved theme that no longer exists
  document.querySelectorAll('[data-theme-toggle]').forEach((b) => b.addEventListener('click', () => {
    const name = next();
    try { localStorage.setItem('theme', name); } catch (e) { /* not remembered */ }
    apply(name);
  }));
})();

load();
</script>
</body>
</html>
