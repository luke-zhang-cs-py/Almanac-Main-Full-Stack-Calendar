name: Python Package

on: [push, pull_request]

jobs:
  build:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 19 October
    # 2026, and a runner image changing under the job is a failure with no
    # code change behind it. Move this on purpose, after a green run.
    runs-on: ubuntu-24.04
    # Well past what this job takes; a stuck run fails here instead of
    # after GitHub's six-hour default.
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # Real errors only: syntax problems and undefined names.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Everything else is advisory.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        # No .env and no DATABASE_URL here, which is the configuration worth
        # testing: the app has to fall back to local SQLite and the mailer to
        # writing messages to the console rather than sending them. Anything
        # that needs a real secret or a real SMTP host is either skipped or
        # is a bug.
        run: pytest -q
